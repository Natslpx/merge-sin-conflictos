<!doctype html>
<!--
  Plantilla de la imagen para compartir de cada propuesta (public/og/propuestas/<slug>.jpg, 1200×630).
  Recibe ?titulo=…&eje=…&color=… desde scripts/og-image/generar.mjs.
-->
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Atkinson';
        src: url('../../node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      :root {
        --verde: #78c203;
        --azul: #034da1;
        --negro: #0b0f14;
        --fondo: color-mix(in srgb, var(--azul) 7%, var(--negro));
        --texto: #eef1f4;
        --texto-suave: color-mix(in srgb, #eef1f4 75%, var(--negro));
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: var(--fondo);
        color: var(--texto);
        font-family: 'Atkinson', sans-serif;
      }
      /* Rama del eje a la izquierda, como en la página. */
      .rama {
        position: absolute;
        left: 72px;
        top: 0;
        bottom: 0;
        width: 10px;
        border-radius: 10px;
        background: var(--c);
      }
      .nodo {
        position: absolute;
        left: 57px;
        top: 214px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 10px solid var(--c);
        background: var(--fondo);
      }
      .lado {
        position: absolute;
        inset: 0 0 0 auto;
        width: 330px;
        background: var(--azul);
      }
      .logo {
        position: absolute;
        right: 30px;
        top: 50%;
        transform: translateY(-50%);
        width: 270px;
      }
      .texto {
        position: absolute;
        left: 136px;
        top: 64px;
        width: 680px;
        height: 502px;
        display: flex;
        flex-direction: column;
      }
      .lista {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: 'Bricolage', sans-serif;
        font-weight: 800;
        font-size: 26px;
      }
      .lista span {
        display: inline-grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--verde);
        color: var(--negro);
      }
      .eje {
        margin-top: 52px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .eje::before {
        content: '';
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--c);
      }
      h1 {
        margin-top: 18px;
        font-family: 'Bricolage', sans-serif;
        font-weight: 800;
        font-size: 66px;
        line-height: 1.02;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      .pie {
        margin-top: auto;
        font-size: 22px;
        font-weight: 700;
        color: var(--texto-suave);
      }
    </style>
  </head>
  <body>
    <div class="rama"></div>
    <div class="nodo"></div>
    <div class="lado"></div>
    <img class="logo" src="../../src/assets/campana/logo.png" alt="" />

    <div class="texto">
      <p class="lista">Merge sin conflictos · Lista <span>3</span></p>
      <p class="eje" id="eje"></p>
      <h1 id="titulo"></h1>
      <p class="pie">Centro de Estudiantes · Ciencia de la Computación · UNSA</p>
    </div>

    <script>
      const q = new URLSearchParams(location.search);
      document.getElementById('titulo').textContent = q.get('titulo') ?? '';
      document.getElementById('eje').textContent = q.get('eje') ?? '';
      document.body.style.setProperty('--c', q.get('color') ?? '#034da1');
      // Títulos muy largos: se achica la letra hasta que entre en el espacio disponible.
      const h1 = document.getElementById('titulo');
      let tam = 66;
      while (h1.scrollHeight > 290 && tam > 40) h1.style.fontSize = `${(tam -= 2)}px`;
    </script>
  </body>
</html>
